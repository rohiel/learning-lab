# One-command production-like run:  docker compose up --build
# Reads secrets from a root .env (see .env.example). SQLite persists in a volume.
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      API_SHARED_SECRET: ${API_SHARED_SECRET:?set API_SHARED_SECRET in .env}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      SCHEDULER_TZ: ${SCHEDULER_TZ:-America/New_York}
      SCHEDULER_HOUR: ${SCHEDULER_HOUR:-20}
    volumes:
      - tutor-data:/data
    restart: unless-stopped

  # One-off: generates Week 1 Days 1-3 pools on first `up` so the app has
  # questions immediately — no manual curl. Idempotent (re-runs skip existing
  # days), runs after the app is healthy, and needs ANTHROPIC_API_KEY.
  seed:
    build: .
    command: python seed_pools.py
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
    volumes:
      - tutor-data:/data
    depends_on:
      app:
        condition: service_healthy
    restart: "no"

volumes:
  tutor-data:
