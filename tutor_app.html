function ErrorBox({ error }) {
  const isAPI = /API error|Failed to fetch|api\.anthropic/.test(error||"");
  return (
    <div style={{ background:"linear-gradient(160deg,#7f1d1d,#991b1b)", borderRadius:16,
      padding:"18px 20px", lineHeight:1.5 }}>
      <div className="display" style={{ fontWeight:600, fontSize:18, marginBottom:6 }}>Couldn't reach the tutor brain</div>
      <div style={{ fontSize:14.5, color:"#fecaca" }}>
        {isAPI
          ? "This app needs to call the Claude API to generate questions. Inside Claude.ai it works automatically. If you're running the file standalone, it needs an Anthropic API key added (Claude Code can do this in one line)."
          : "Something went wrong: " + error}
      </div>
    </div>
  );
}

/* ============================================================
   ROOT APP
   ============================================================ */
const DEFAULT_PROFILE = {
  name: "Anam",
  currentWeek: 1, currentDay: 1,
  sessions: [],
  weakSpots: { math: [], english: [] },
  retentionQueue: { math: [], english: [] },
  mastered: { math: [], english: [] },
  practicedWords: [],
  writingThisWeek: {},
  helpTotal: 0,
  manualDays: {},    // { "math:1:2": true } → manually marked day done
  manualWeeks: {}    // { "english:1": true } → manually marked week done
};

function App() {
  const [screen, setScreen] = useState("setup"); // setup | quiz | results | work | review
  const [config, setConfig] = useState(null);
  const [profile, setProfile] = useState(DEFAULT_PROFILE);
  const [lastSession, setLastSession] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [resumeData, setResumeData] = useState(null);   // unfinished session, if any
  const [resuming, setResuming] = useState(false);

  useEffect(() => {
    (async () => {
      // check for an unfinished session to resume
      try {
        const active = await Store.get("activeSession", null);
        if (active && active.questions && active.questions.length && active.idx < active.questions.length) {
          setResumeData(active);
        }
      } catch(e) {}

      const p = await Store.get("profile", DEFAULT_PROFILE);
      // migrate shape
      const merged = { ...DEFAULT_PROFILE, ...p,
        weakSpots: { ...DEFAULT_PROFILE.weakSpots, ...(p.weakSpots||{}) },
        retentionQueue: { ...DEFAULT_PROFILE.retentionQueue, ...(p.retentionQueue||{}) },
        mastered: { ...DEFAULT_PROFILE.mastered, ...(p.mastered||{}) },
        practicedWords: p.practicedWords || [],
        writingThisWeek: p.writingThisWeek || {},
        helpTotal: p.helpTotal || 0,
        manualDays: p.manualDays || {},
        manualWeeks: p.manualWeeks || {} };

      // One-time backfill: mark Week 1, Days 1-2 done for Math & English
      // (work completed before day-tracking existed). Runs once via a flag.
      if (!merged.backfilledW1D12) {
        merged.sessions = merged.sessions || [];
        for (const subj of ["math","english"]) {
          for (const d of [1,2]) {
            const exists = merged.sessions.some(
              x => x.subject===subj && x.week===1 && x.day===d && x.mode==="practice");
            if (!exists) {
              merged.sessions.push({
                date: new Date().toISOString(),
                subject: subj, week: 1, day: d, mode: "practice",
                score: null, total: null, maxLevel: null,
                weakSkills: [], retentionResults: [], helpRequests: 0,
                backfilled: true   // marks it as a manual catch-up entry, not a graded session
              });
            }
          }
        }
        merged.backfilledW1D12 = true;
        await Store.set("profile", merged);
      }

      setProfile(merged);
      setLoaded(true);
    })();
  }, []);

  const saveProfile = useCallback(async (p) => {
    setProfile(p);
    await Store.set("profile", p);
  }, []);

  function start(cfg) {
    setResuming(false);
    setConfig(cfg);
    if (cfg.subject === "work") setScreen("work");
    else if (cfg.subject === "review") setScreen("review");
    else if (cfg.subject === "writing") setScreen("writing");
    else setScreen("quiz");
  }

  function resumeSession() {
    setConfig(resumeData.config);
    setResuming(true);
    setScreen("quiz");
  }
  async function discardSession() {
    setResumeData(null);
    await Store.set("activeSession", null);
  }

  if (!loaded) return <CenterWrap><Spinner label="Loading Anam's lab…" /></CenterWrap>;

  return (
    <>
      {screen==="setup" && <>
        {resumeData && (
          <div style={{ maxWidth:720, margin:"0 auto", padding:"18px 18px 0" }}>
            <div style={{ background:"linear-gradient(160deg,#1e3a8a,#1d4ed8)", borderRadius:16,
              padding:"16px 20px", display:"flex", alignItems:"center", justifyContent:"space-between",
              gap:12, flexWrap:"wrap" }}>
              <div>
                <div className="display" style={{ fontSize:17, fontWeight:600 }}>
                  📌 You have an unfinished {resumeData.config.subject==="math"?"Math":"English"} session
                </div>
                <div style={{ fontSize:13.5, color:"#dbeafe", marginTop:3 }}>
                  Week {resumeData.config.week}, Day {resumeData.config.day} · question {resumeData.idx+1} of {resumeData.questions.length}
                </div>
              </div>
              <div style={{ display:"flex", gap:8 }}>
                <button onClick={discardSession} style={{ padding:"10px 14px", borderRadius:10,
                  background:"#0003", color:"#fff", fontWeight:700, fontSize:14 }}>Start fresh</button>
                <button onClick={resumeSession} style={{ padding:"10px 16px", borderRadius:10,
                  background:"linear-gradient(90deg,#16a34a,#22c55e)", color:"#fff", fontWeight:700, fontSize:14 }}>
                  Resume →
                </button>
              </div>
            </div>
          </div>
        )}
        <Setup onStart={start} profile={profile} saveProfile={saveProfile} />
      </>}
      {screen==="quiz" && <Quiz config={config} profile={profile} saveProfile={saveProfile}
        resumeData={resuming ? resumeData : null}
        onDone={(s,np)=>{ setLastSession(s); setResumeData(null); setResuming(false); setScreen("results"); }}
        onExit={()=>{ setResuming(false); setScreen("setup"); }} />}
      {screen==="results" && <Results session={lastSession} profile={profile} onHome={()=>setScreen("setup")} />}
      {screen==="work" && <WorkUpload onExit={()=>setScreen("setup")} />}
      {screen==="writing" && <Writing config={config} profile={profile} saveProfile={saveProfile}
        onExit={()=>setScreen("setup")} />}
      {screen==="review" && <ParentReview profile={profile} onExit={()=>setScreen("setup")} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
